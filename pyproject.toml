[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# Mirrors the core rules Home Assistant enforces on its own integrations, so the
# code stays PR-ready for core rather than merely "custom component clean".
select = [
    "A",      # flake8-builtins
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "N",      # pep8-naming
    "PGH",    # pygrep-hooks
    "RUF",    # ruff specific
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "TRY003",  # long messages outside the exception class are fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
# Home Assistant is a dependency here, not the project being built, so only the
# integration and its tests are first-party.
known-first-party = ["custom_components", "tests"]
combine-as-imports = true
split-on-trailing-comma = false
