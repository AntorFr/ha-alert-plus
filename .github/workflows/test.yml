name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Home Assistant 2026.8 requires >=3.14.2, and every
          # pytest-homeassistant-custom-component release since 0.13.317
          # follows it, so 3.13 cannot even resolve the dependency.
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Home Assistant 2026.8 requires >=3.14.2, and every
          # pytest-homeassistant-custom-component release since 0.13.317
          # follows it, so 3.13 cannot even resolve the dependency.
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
